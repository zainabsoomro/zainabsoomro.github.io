<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zainab Soomro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Georgia, "Times New Roman", serif;
            background: #f7f4ef;
            color: #2c2a26;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 48px 24px;
        }

        p.eyebrow {
            margin: 0 0 16px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #8a8174;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(36px, 6vw, 56px);
            font-weight: normal;
            letter-spacing: -0.02em;
        }

        p.tagline {
            margin: 0;
            max-width: 28em;
            font-size: 18px;
            line-height: 1.6;
            color: #5c574e;
        }

        footer {
            padding: 24px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            color: #8a8174;
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Coming soon</p>
        <h1>Zainab Soomro</h1>
        <p class="tagline">
            A personal page is on the way. Check back soon.
        </p>
    </main>

    <footer>
        © 2026 Zainab Soomro
    </footer>
</body>
</html>
