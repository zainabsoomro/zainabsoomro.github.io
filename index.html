<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website ZTS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #666;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #444;
        }

        footer {
            text-align: center;
            color: #888;
            padding: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Website</h2>
    </header>

    <main>
        <h1>Hello! 👋</h1>

        <p>
            Welcome to my GitHub Pages website.
        </p>

        <a class="button" href="https://github.com">
            Visit GitHub
        </a>
    </main>

    <footer>
        © 2026 My Website
    </footer>

</body>
</html>
